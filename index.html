<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>8番インターチェンジ</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>8番インターチェンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#06080C;
  --ink:#EEE8DC;
  --dim:#A7AFBC;
  --sodium:#FFB65E;
  --sign:#0D6A3F;
  --plate:#F4F6F2;
  --crash:#FF3B2F;
  --glass:rgba(10,14,20,.46);
  --glass-edge:rgba(238,232,220,.22);
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--night);color:var(--ink);overflow:hidden;
  font:15px/1.6 "BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;background:var(--night);}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;}

#speed{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:baseline;gap:6px;padding:3px 12px;border-radius:8px;background:var(--glass);
  color:var(--sodium);font-variant-numeric:tabular-nums;pointer-events:none;}
#speed b{font-size:26px;font-weight:700;min-width:3ch;text-align:right;letter-spacing:.02em;}
#speed span{font-size:12px;color:var(--dim);letter-spacing:.08em;}

#pause,#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:10px;border:1px solid var(--glass-edge);background:var(--glass);color:var(--ink);
  font:700 14px/1 "BIZ UDPGothic",system-ui,sans-serif;letter-spacing:.1em;cursor:pointer;}
#snd{right:calc(64px + env(safe-area-inset-right,0px));font-size:15px;letter-spacing:0;z-index:5;}
#snd.off{opacity:.55;text-decoration:line-through;}

#touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));
  pointer-events:none;}
#touch .grp{display:flex;gap:12px;align-items:flex-end;pointer-events:auto;}
.tb{touch-action:none;border:1px solid var(--glass-edge);background:var(--glass);color:var(--ink);border-radius:16px;
  font:700 15px/1 "BIZ UDPGothic",system-ui,sans-serif;display:grid;place-items:center;padding:0;cursor:pointer;}
.tb.steer{width:84px;height:84px;font-size:24px;}
.tb.brake{width:78px;height:68px;}
.tb.accel{width:84px;height:124px;border-color:rgba(255,182,94,.45);color:var(--sodium);}
.tb.on{background:rgba(255,182,94,.28);border-color:var(--sodium);}

#crash{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,40,30,0) 35%,rgba(255,34,24,.42) 100%);}
#crash .big{font:900 clamp(56px,14vw,140px)/1 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--crash);
  letter-spacing:.06em;text-shadow:0 0 28px rgba(255,59,47,.65);}
#crash .sub{margin-top:10px;font-size:18px;color:var(--ink);letter-spacing:.12em;}

#rotate{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);
  font-size:13px;color:var(--dim);pointer-events:none;white-space:nowrap;}

#panel{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(3,5,8,.38);}
.sign{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--sign);color:#fff;border-radius:14px;
  box-shadow:inset 0 0 0 4px var(--sign),inset 0 0 0 7px #fff,0 18px 50px rgba(0,0,0,.55);padding:26px 28px 22px;}
.sign .eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.16em;}
.sign .badge{background:var(--plate);color:var(--sign);border-radius:6px;padding:1px 8px;font-weight:700;letter-spacing:.04em;}
.sign h1{margin:6px 0 2px;font:900 clamp(34px,7vw,52px)/1.05 "Zen Kaku Gothic New",system-ui,sans-serif;letter-spacing:.01em;text-wrap:balance;}
.sign .lede{margin:0 0 14px;font-size:16px;}
.intro{width:min(640px,100%);}
.intro .rule{margin:14px 0 0;font:700 clamp(20px,3.4vw,28px)/1.45 "BIZ UDPGothic",system-ui,sans-serif;text-wrap:balance;}
.intro .rule b{background:var(--plate);color:var(--sign);border-radius:6px;padding:0 .3em;margin:0 .1em;}
.intro .rule.warn{color:#FFD9D4;}
.keys{width:100%;margin:20px 0 20px;border-collapse:separate;border-spacing:0 6px;font-size:clamp(15px,2.4vw,19px);}
.keys th,.keys td{text-align:left;padding:4px 8px;vertical-align:baseline;}
.keys thead th{font-size:.8em;font-weight:400;opacity:.85;letter-spacing:.06em;}
.keys tbody th{font-weight:700;white-space:nowrap;}
.keys tbody td{font-weight:700;background:rgba(255,255,255,.1);border-radius:6px;}
.is-touch .keys .desk,.is-desk .keys .touch{display:none;}
#start{width:100%;height:52px;border:0;border-radius:10px;background:var(--plate);color:var(--sign);
  font:900 20px/1 "Zen Kaku Gothic New",system-ui,sans-serif;letter-spacing:.14em;cursor:pointer;}
#start:disabled{opacity:.6;cursor:progress;}
#start:focus-visible,#pause:focus-visible,#snd:focus-visible,.tb:focus-visible{outline:3px solid var(--sodium);outline-offset:3px;}
#err{margin-top:10px;font-size:13px;color:#ffd7cf;}
#over{position:fixed;inset:0;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at center,rgba(40,6,4,.55) 30%,rgba(90,10,6,.78) 100%);}
.sign.result{width:min(460px,100%);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px;}
.stats div{background:rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;}
.stats dt{font-size:12px;letter-spacing:.08em;opacity:.85;}
.stats dd{margin:2px 0 0;font-size:13px;font-variant-numeric:tabular-nums;}
.stats b{font-size:30px;font-weight:700;margin-right:2px;}
#retry{width:100%;height:52px;border:0;border-radius:10px;background:var(--plate);color:var(--sign);
  font:900 20px/1 "Zen Kaku Gothic New",system-ui,sans-serif;letter-spacing:.12em;cursor:pointer;}
#retry:focus-visible{outline:3px solid var(--sodium);outline-offset:3px;}
#ending{position:fixed;inset:0;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at 70% 60%,rgba(255,170,90,.28) 0%,rgba(20,12,6,.72) 60%,rgba(6,5,4,.9) 100%);}
.home-card{width:min(480px,100%);padding:30px 30px 24px;border-radius:14px;color:#F6EBDD;
  background:rgba(22,15,9,.78);box-shadow:inset 0 0 0 1px rgba(255,190,120,.35),0 18px 50px rgba(0,0,0,.55);}
.home-eyebrow{margin:0;font-size:14px;letter-spacing:.2em;color:var(--sodium);}
.home-card h1{margin:6px 0 4px;font:900 clamp(44px,9vw,68px)/1.05 "Zen Kaku Gothic New",system-ui,sans-serif;color:#FFE3BF;}
.stats.home-stats{grid-template-columns:repeat(2,1fr);}
#again{width:100%;height:52px;border:0;border-radius:10px;background:var(--sodium);color:#2A1706;
  font:900 20px/1 "Zen Kaku Gothic New",system-ui,sans-serif;letter-spacing:.12em;cursor:pointer;}
#again:focus-visible{outline:3px solid #fff;outline-offset:3px;}
@media (max-height:460px){
  .sign{padding:16px 20px 14px;}
  .sign h1{font-size:30px;}
  .intro .rule{font-size:19px;margin-top:8px;}
  .keys{margin:10px 0;font-size:15px;border-spacing:0 3px;}
  #start{height:44px;}
}
@media (prefers-reduced-motion: reduce){ #crash .big{text-shadow:none;} }
</style>

<div id="stage"><canvas id="c" aria-label="夜の高速を走る運転席からの眺め"></canvas></div>
<div id="speed"><b id="kmh">80</b><span>km/h</span></div>
<button id="pause" type="button" aria-label="一時停止" hidden>II</button>
<button id="snd" type="button" aria-label="音を消す" aria-pressed="true" hidden>音</button>
<div id="rotate" hidden>横向きにすると見やすくなります</div>
<div id="touch" hidden>
  <div class="grp">
    <button id="bL" class="tb steer" type="button" aria-label="左へ">◀</button>
    <button id="bR" class="tb steer" type="button" aria-label="右へ">▶</button>
  </div>
  <div class="grp">
    <button id="bB" class="tb brake" type="button">ブレーキ</button>
    <button id="bA" class="tb accel" type="button">アクセル</button>
  </div>
</div>
<div id="crash" hidden><div class="big">CRASH</div><div class="sub" id="cause"></div></div>
<div id="over" hidden>
  <div class="sign result" role="dialog" aria-labelledby="overTtl">
    <div class="eyebrow"><span class="badge">終了</span><span id="overCause"></span></div>
    <h1 id="overTtl">GAME OVER</h1>
    <dl class="stats">
      <div><dt>到達</dt><dd><b id="overCount">0</b>番出口</dd></div>
      <div><dt>この回の最高</dt><dd><b id="overBest">0</b>番出口</dd></div>
      <div><dt>走った区間</dt><dd><b id="overSecs">0</b></dd></div>
    </dl>
    <button id="retry" type="button">もう一度走る</button>
  </div>
</div>
<div id="ending" hidden>
  <div class="home-card" role="dialog" aria-labelledby="endTtl">
    <p class="home-eyebrow">8番出口</p>
    <h1 id="endTtl">ただいま。</h1>
    <dl class="stats home-stats">
      <div><dt>走った区間</dt><dd><b id="endSecs">0</b></dd></div>
      <div><dt>時間</dt><dd><b id="endTime">0:00</b></dd></div>
    </dl>
    <button id="again" type="button">もう一度走る</button>
  </div>
</div>
<div id="panel">
  <div class="sign intro" role="dialog" aria-labelledby="ttl">
    <h1 id="ttl">8番インターチェンジ</h1>
    <p class="rule">異変が無ければ<b>左の出口</b>へ。<br>あると思ったら、出ずに<b>本線</b>を進む。</p>
    <p class="rule warn">車にぶつかったら死ぬ。</p>
    <table class="keys">
      <thead><tr><th></th><th>アクセル</th><th>ブレーキ</th><th>ハンドル</th></tr></thead>
      <tbody>
        <tr class="desk"><th>キーボード</th><td>↑ / W</td><td>↓ / S</td><td>← → / A D</td></tr>
        <tr class="desk"><th>パッド</th><td>LT / B</td><td>RT / A</td><td>左スティック</td></tr>
        <tr class="touch"><th>スマホ</th><td>右下のボタン</td><td>その左</td><td>左下 ◀ ▶</td></tr>
      </tbody>
    </table>
    <button id="start" type="button" disabled>読み込み中…</button>
    <div id="err" hidden></div>
  </div>
</div>

<script type="module">
/* NightDrive - browser port of the UE 5.8 NightDrive prototype.
   Units are metres. Axes: +x forward along the highway, +y up, +z to the driver's right.
   (UE X,Y,Z in cm maps to three x=X/100, y=Z/100, z=Y/100.)
   Unlike the UE build the car really moves through the world, which is what makes the
   full 360-degree loop exit possible. The highway repeats every SECTION metres; the
   player and traffic are shifted back by SECTION when they cross the end, and three
   copies of the section geometry (-1, 0, +1) hide the seam. */
const $ = id => document.getElementById(id);
const startBtn = $('start'), errEl = $('err');
function fail(msg){ errEl.hidden = false; errEl.textContent = msg; startBtn.disabled = true; startBtn.textContent = '起動できません'; }

let THREE;
try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js'); }
catch (e) { fail('3D ライブラリを読み込めませんでした。通信状況を確かめて、ページを開き直してください。'); throw e; }
THREE.ColorManagement.enabled = false;   // every colour below is a display value; no sRGB round trips

const isMobile = matchMedia('(pointer: coarse)').matches || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
document.body.classList.add(isMobile ? 'is-touch' : 'is-desk');   /* the start card shows only this device's controls */
const D2R = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------------------------------------------------------- layout */
/* One section, in the order the player meets it:
     merge -> "N番出口 1km" sign: the anomaly-watch zone starts -> tunnel (inside the zone)
     -> the zone runs on -> gantry -> deceleration lane -> fork, 1 km after the sign: choose
     -> loop exit or main line -> guardrail ends: merge right whenever you like -> wrap.
   The choice is judged the moment you pass the fork, and the next section's anomaly is
   rolled right then - everything it touches is out of sight at that moment. */
const SIGN_X = 30;                     // "N番出口 1km", straight after the merge
const TUN_A = SIGN_X + 70, TUN_B = TUN_A + 190;     // the tunnel is part of the watch zone
const FORK = SIGN_X + 1000;            // gore nose, 1 km on from the sign
const DECEL_START = FORK - 240, DECEL_FULL = DECEL_START + 70;
const GANTRY_X = DECEL_START - 30;     // the exit gantry closes the zone
const ZONE_A = SIGN_X + 50, ZONE_B = GANTRY_X - 40; // anomalies only ever appear in here
const DECEL_C = -7.0;                  // deceleration / acceleration lane centre
/* Radius 28 m and a 6.5 m climb still let the loop pass over its own entry. The descent is
   finished before the ramp comes alongside the main line, so the merge is flat. */
const DIV_LEN = 64, DIV_Z = -17;       // peel away to 17 m left of the main line
const LOOP_R = 28, LOOP_RISE = 6.5;    // one full turn, climbing so it can pass over itself
const OUT_LEN = 150, ACC_LEN = 120, ACC_TAPER = 50;
const P_X = FORK + DIV_LEN;            // loop starts and ends here
const OUT_END = P_X + OUT_LEN;
const ACC_END = OUT_END + ACC_LEN;     // end of the acceleration lane proper
const MERGE_END = ACC_END + ACC_TAPER; // lane gone
/* after the merge, a lane peels off to the left: 8番出口's way home when staying on the main
   line was the right answer. Closed off (a barricade across the lane) the rest of the time. */
const HM_A = MERGE_END + 10, HM_FULL = HM_A + 50, HM_FORK = HM_FULL + 30;
const SECTION = HM_FORK + 96;          // wrap after that; the next sign follows at once
const BORE_R = 7.8, BORE_C0 = 0.0, BORE_C1 = 18.2;
const MEDIAN_Z = 9.2;
const LANES = [-3.5, 0, 3.5];
const ONC = [14.4, 17.9, 21.4];
const LM_Z0 = -640, LM_Z1 = 30, LMW = 840, LMH = 680;   // reaches down the hillside to the town
const SAFE = 18.0;                     // 65 km/h: below this the car behind starts closing in
const VMAX = 39.0;                     // 140 km/h
const SODIUM = [1.0, 0.64, 0.30], TLIGHT = [1.0, 0.60, 0.26];

function groundY(z){                   // the highway runs along a ridge; a long hillside drops to the town
  if (z >= -9.2) return -0.25;
  if (z >= -520) return lerp(-0.25, -40, (-9.2 - z) / 510.8);
  return -40;
}

/* ---------------------------------------------------------------- geometry builder */
class B {
  constructor(){ this.p = []; this.c = []; this.e = []; this.l = []; this.t = []; }
  _v(v, col, e, l, u, w){ this.p.push(v[0], v[1], v[2]); this.c.push(col[0], col[1], col[2]); this.e.push(e); this.l.push(l); this.t.push(u, w); }
  quad(a, b, c, d, col, e = 0, l = 1, uv){
    const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2], vx = d[0]-a[0], vy = d[1]-a[1], vz = d[2]-a[2];
    const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const n = Math.hypot(nx, ny, nz) || 1;
    const sh = 0.64 + 0.36 * Math.abs(ny / n);     // tops bright, walls dimmer - reads as light from above
    const cc = [col[0]*sh, col[1]*sh, col[2]*sh];
    const U = uv || [0,0, 1,0, 1,1, 0,1];
    this._v(a,cc,e,l,U[0],U[1]); this._v(b,cc,e,l,U[2],U[3]); this._v(c,cc,e,l,U[4],U[5]);
    this._v(a,cc,e,l,U[0],U[1]); this._v(c,cc,e,l,U[4],U[5]); this._v(d,cc,e,l,U[6],U[7]);
  }
  hq(x0, x1, z0, z1, y, col, e = 0, l = 1){ this.quad([x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1], col, e, l); }
  /* box: centre, size (along heading, up, along right), heading th (+ turns right), pitch ph (+ nose up) */
  box(cx, cy, cz, sx, sy, sz, col, e = 0, l = 1, th = 0, ph = 0){
    const fc = Math.cos(th), fs = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);
    const P = (lx, ly, lz) => { const X = lx*cp - ly*sp, Y = lx*sp + ly*cp; return [cx + X*fc - lz*fs, cy + Y, cz + X*fs + lz*fc]; };
    const hx = sx/2, hy = sy/2, hz = sz/2;
    const v = [P(-hx,-hy,-hz),P(hx,-hy,-hz),P(hx,hy,-hz),P(-hx,hy,-hz),P(-hx,-hy,hz),P(hx,-hy,hz),P(hx,hy,hz),P(-hx,hy,hz)];
    this.quad(v[0],v[1],v[2],v[3],col,e,l); this.quad(v[5],v[4],v[7],v[6],col,e,l);
    this.quad(v[4],v[0],v[3],v[7],col,e,l); this.quad(v[1],v[5],v[6],v[2],col,e,l);
    this.quad(v[3],v[2],v[6],v[7],col,e,l); this.quad(v[4],v[5],v[1],v[0],col,e,l);
  }
  /* a rail between two base points, spanning y0..y1 above them */
  bar(a, b, y0, y1, t, col, e = 0, l = 1){
    const dx = b[0]-a[0], dz = b[2]-a[2], L = Math.hypot(dx, dz) || 1, nx = -dz/L*t/2, nz = dx/L*t/2;
    const A0=[a[0]+nx,a[1]+y0,a[2]+nz], A1=[a[0]+nx,a[1]+y1,a[2]+nz], B0=[b[0]+nx,b[1]+y0,b[2]+nz], B1=[b[0]+nx,b[1]+y1,b[2]+nz];
    const C0=[a[0]-nx,a[1]+y0,a[2]-nz], C1=[a[0]-nx,a[1]+y1,a[2]-nz], D0=[b[0]-nx,b[1]+y0,b[2]-nz], D1=[b[0]-nx,b[1]+y1,b[2]-nz];
    this.quad(A0,B0,B1,A1,col,e,l); this.quad(C0,D0,D1,C1,col,e,l); this.quad(A1,B1,D1,C1,col,e,l);
  }
  empty(){ return this.p.length === 0; }
  geo(){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('aCol', new THREE.Float32BufferAttribute(this.c, 3));
    g.setAttribute('aEmi', new THREE.Float32BufferAttribute(this.e, 1));
    g.setAttribute('aLit', new THREE.Float32BufferAttribute(this.l, 1));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.t, 2));
    g.computeBoundingSphere();
    return g;
  }
}

/* ---------------------------------------------------------------- the exit loop path */
/* Peel off left, one full left-hand turn while climbing 7 m, fly back over the entry,
   drop down and across into the acceleration lane. Resampled every metre of arc length. */
const EX = (() => {
  const raw = [];
  const n1 = 440; for (let i = 0; i <= n1; i++){ const t = i/n1; raw.push([FORK + DIV_LEN*t, DECEL_C + (DIV_Z - DECEL_C)*sm(t), 0]); }
  const n2 = 1300, cx = P_X, cz = DIV_Z - LOOP_R;
  for (let i = 1; i <= n2; i++){ const a = 2*Math.PI*i/n2; raw.push([cx + LOOP_R*Math.sin(a), cz + LOOP_R*Math.cos(a), LOOP_RISE*sm(i/n2)]); }
  const loopEndRaw = raw.length - 1;
  const n3 = 880; for (let i = 1; i <= n3; i++){ const t = i/n3; raw.push([P_X + OUT_LEN*t, DIV_Z + (DECEL_C - DIV_Z)*sm(t), LOOP_RISE*(1 - sm(t / 0.72))]); }
  const n4 = 220; for (let i = 1; i <= n4; i++){ const t = i/n4; raw.push([OUT_END + ACC_LEN*t, DECEL_C, 0]); }
  const cum = [0];
  for (let i = 1; i < raw.length; i++){ const a = raw[i-1], b = raw[i]; cum.push(cum[i-1] + Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2])); }
  const Ltot = cum[cum.length - 1], N = Math.floor(Ltot) + 1;
  const X = new Float32Array(N), Z = new Float32Array(N), H = new Float32Array(N), TH = new Float32Array(N), PT = new Float32Array(N);
  let j = 0;
  for (let s = 0; s < N; s++){
    while (j < raw.length - 2 && cum[j+1] < s) j++;

/* ---------------------------------------------------------------- traffic behaviour */
function laneClear(lane, x, ahead, behind, self){
  const z = LANES[lane];
  for (const o of traffic){ if (o === self || o.onc) continue;
    if (Math.abs(o.z - z) < 2.2 && o.x - x < ahead + o.hl && x - o.x < behind + o.hl) return false; }

  return true;
}
function placeSame(c, ahead){
  c.stand = false; c.hl = c.hl0;
  for (let t = 0; t < 30; t++){
    const lane = Math.floor(Math.random()*3);
    const x = ahead ? pose.x + 420 + Math.random()*260 : pose.x - 220 - Math.random()*120;
    if (laneClear(lane, x, 30, 30, c)){ c.lane = lane; c.tgt = lane; c.z = LANES[lane]; c.x = x; break; }
  }
  c.vPref = c.truck ? 21 + Math.random()*3 : ahead ? 23 + Math.random()*4 : 27 + Math.random()*4;
  c.v = c.vPref; c.lc = 0; c.ind = 0;
}

   has one speed, so they never run into each other. */
const SAME_V = [19, 21.5, 24];
function placeOnc(c, spread){
  c.same = sameMode;

    for (let t = 0; t < 20; t++){
      const lane = Math.floor(Math.random()*3), x = spread ? pose.x + 30 + Math.random()*560 : pose.x + 430 + Math.random()*250;
      if (traffic.every(o => o === c || !o.onc || !o.same || o.lane !== lane || Math.abs(o.x - x) > 24)){ c.lane = lane; c.x = x; break; }
    }
    c.z = ONC[c.lane]; c.vPref = c.v = SAME_V[c.lane];
    return;
  }
  c.lane = Math.floor(Math.random()*3); c.z = ONC[c.lane];
  /* while the last same-way cars are still driving off, new oncoming ones start further out */
  c.x = spread ? pose.x - 150 + Math.random()*800 : pose.x + 520 + Math.random()*420 + (traffic.some(o => o.onc && o.same) ? 400 : 0);

}
function seedTraffic(){

    for (let t = 0; t < 30; t++){
      const lane = Math.floor(Math.random()*3), x = pose.x - 120 + Math.random()*640;
      if (Math.abs(x - pose.x) < 40 && lane === 1) continue;
      if (laneClear(lane, x, 30, 30, c)){ c.lane = lane; c.tgt = lane; c.z = LANES[lane]; c.x = x; break; }
    }
    c.vPref = c.v = c.truck ? 21 + Math.random()*3 : 23 + Math.random()*6; c.lc = 0; c.ind = 0;
  }
}
function updateTraffic(dt){

        const d = c.x - pose.x;

      } else {

    let want = c.vPref;
    if (gap < 40) want = Math.min(want, lv + (gap - 12) * 0.25);
    if (gap < 6) want = Math.min(want, lv - 2);
    c.v = Math.max(0, c.v + clamp(want - c.v, -7*dt, 2.2*dt));
    const z0 = c.z;
    c.x += c.v * dt;
    if (c.lc === 0){
      c.timer -= dt;
      const blocked = gap < 50 && lv < c.vPref - 2.5;
      if ((blocked || c.timer <= 0) && !c.truck && !c.stand){
        const first = Math.random() < 0.5 ? -1 : 1;
        for (const dir of [first, -first]){

        }

/* one of the cars on your side, stood up on its tail and crawling along at 43 km/h a little

  if (!c) return;
  for (let t = 0; t < 30; t++){
    const lane = Math.floor(Math.random() * 3), x = TUN_B + 90 + Math.random() * 50;
    if (laneClear(lane, x, 40, 40, c)){ c.lane = c.tgt = lane; c.z = LANES[lane]; c.x = x; break; }

/* ---------------------------------------------------------------- rules */
const crashEl = $('crash'), causeEl = $('cause'), kmhEl = $('kmh');

/* Judged the moment you pass the fork. No anomaly: take the exit. An anomaly: stay on the

function judgeAtFork(took){

  if (right && P.count >= 8){
    /* 8番出口: whichever way was right, its road home opens - off the loop, or off the main line */
    P.home = took ? 'exit' : 'main';

    P.count = right ? Math.min(P.count + 1, 8) : 0;

  $('endSecs').textContent = P.sections; $('endTime').textContent = mm + ':' + ss;
  endEl.hidden = false; $('again').focus();

}
/* a crash ends the run: a short red beat, then the result card */
const overEl = $('over');
function gameOver(){

  $('overCause').textContent = causeEl.textContent;

function resetRun(){
  Object.assign(P, { onExit: false, x: START_X, s: 0, d: 0, v: 22, steer: 0, latV: 0, dead: false, deadT: 0, runT: 0, risk: 0, rearHit: false,
                     took: false, count: 0, sections: 0, over: false, home: false, homeLeg: false, hp: HOME, ended: false, endT: 0 });
  yawBlend = 0; crashEl.hidden = true; overEl.hidden = true; endEl.hidden = true; barricade.g.visible = true; barricadeM.g.visible = true;
  sameMode = false; pendingRoll = false; for (const f of flyers) f.on = false;

function step(dt){
  clock += dt;
  yawBlend *= Math.exp(-dt * 5);
  const inp = readInput();
  lastThr = P.dead ? 0 : inp.thr;
  if (P.dead){
    P.v = Math.max(0, P.v - 10*dt); P.deadT += dt;
    if (P.deadT > 1.6 && !P.over) gameOver();
  } else {
    if (inp.thr > 0) P.v += 5.6 * inp.thr * (1 - P.v / VMAX) * dt;
    if (inp.brk > 0) P.v -= 11 * inp.brk * dt;
    P.v = clamp(P.v - (0.15 + 0.012 * P.v) * dt, 0, VMAX);
  }
  P.steer += ((P.dead ? 0 : inp.st) - P.steer) * Math.min(1, dt * 7);
  P.latV = P.steer * 3.2 * clamp(P.v / 8, 0, 1);
  P.d += P.latV * dt;
  const [lo, hi] = lateralBounds(); P.d = clamp(P.d, lo, hi);
  const ds = P.v * dt;
  if (P.onExit){
    P.s += ds;
    /* at the start of the loop the road home carries straight on - if it was earned */
    if (P.home === 'exit' && !P.homeLeg && P.s >= EX.loopS0){ P.s -= EX.loopS0; P.homeLeg = true; P.hp = HOME; }
    if (P.homeLeg){
      /* roll up to the gate and stop */
      const stopAt = P.hp.L - 12;
      if (P.s > stopAt - 70) P.v = Math.min(P.v, Math.max(0, (stopAt - P.s) * 0.45));
      if (P.s >= stopAt){ P.s = stopAt; P.v = 0; }
      if (P.v < 0.3 && P.s > stopAt - 20){ P.endT += dt; if (P.endT > 1.2 && !P.ended) showEnding(); }
    }
    /* the rail between ramp and main line ends here: hand the car to the main line, so it can
       move right at any point from now on instead of only at the end of the ramp */

      const q = exPose(P.s, P.d, {});

    const x0 = P.x; P.x += ds;

    if (x0 < FORK && P.x >= FORK){

      if (took){ P.onExit = true; P.s = P.x - FORK; P.d -= DECEL_C; }
    }
    /* the main-line road home: keep left into the opened lane */
    if (P.home === 'main' && x0 < HM_FORK && P.x >= HM_FORK){
      if (P.d < -5.4){ P.onExit = true; P.homeLeg = true; P.hp = HOME_M; P.s = P.x - HM_FORK; P.d -= DECEL_C; }
      else { P.home = false; barricadeM.g.visible = true; }
    }
    if (!P.onExit && P.x >= SECTION){
      P.x -= SECTION; runner.x -= SECTION;
      for (const c of traffic) c.x -= SECTION;

  if (pendingRoll && !P.homeLeg && (P.onExit ? P.s > EX.loopS0 + 20 : P.x > FORK + 80)){ pendingRoll = false; rollAnomaly(); }
  playerPose(pose);
  updateTraffic(dt);
  for (const f of flyers){
    if (!f.on) continue;
    f.x -= f.v * dt;
    /* once overhead it is out of every view: send it round again while the zone lasts */
    if (f.x < pose.x - 10){ if (anomaly === 7 && pose.x + 360 < GANTRY_X) spawnFlyer(f, pose.x + 360 + Math.random() * 120); else f.on = false; }
  }
  if (runner.on && runner.x > TUN_B + 6) runner.x = Math.max(TUN_B + 6, runner.x - 4.3 * dt);

  if (P.homeLeg) P.risk = 0;          /* nobody follows you home */
  if (!P.dead){

      if (c.onc) continue;
      if (Math.abs(c.x - pose.x) < 2.3 + c.hl && Math.abs(c.z - pose.z) < 0.92 + c.hw){ die('衝突した'); break; }
    }

       chance of it hitting you climbs with how close it is */

    }

  }
}

/* ---------------------------------------------------------------- per-frame scene sync */
const v3 = new THREE.Vector3(), camW = new THREE.Vector3(), lmS = [0, 0, 0];
function carLampGlows(x, y, z, th, hl, truck, ind, indOn, head, tail){
  const cs = Math.cos(th), sn = Math.sin(th);
  const W = (lx, ly, lz) => [x + lx*cs - lz*sn, y + ly, z + lx*sn + lz*cs];
  const tx = camW.x - x, tz = camW.z - z, tl = Math.hypot(tx, tz) || 1, dot = (cs*tx + sn*tz) / tl;
  const front = clamp(dot * 3, 0, 1) * head, back = clamp(-dot * 3, 0, 1) * tail;
  const lz = truck ? 0.95 : 0.62, ty = truck ? 0.9 : 0.74, hy = truck ? 0.8 : 0.64;
  for (const s of [-1, 1]){
    if (back > 0){ const p = W(-hl - 0.03, ty, s*lz); dglow(p[0], p[1], p[2], 0.95*back, 0.08*back, 0.05*back, 0.55);
      if (tail > 1) dglow(p[0], p[1], p[2], 0.32*back, 0.03*back, 0.02*back, 2.8); }
    if (front > 0){ const p = W(hl + 0.03, hy, s*lz); dglow(p[0], p[1], p[2], front, 0.95*front, 0.85*front, 0.75); dglow(p[0], p[1], p[2], 0.34*front, 0.32*front, 0.29*front, 3.4); }
  }
  if (ind && indOn) for (const e of [-1, 1]){ const p = W(e*(hl - 0.1), ty + 0.05, ind*(truck ? 1.25 : 0.91)); dglow(p[0], p[1], p[2], 1.0, 0.55, 0.05, 0.55); }
}
function sync(){
  const yawOff = Math.atan2(P.latV, Math.max(P.v, 1)) * 0.9 + yawBlend;
  car.position.set(pose.x, pose.y, pose.z);
  car.rotation.set(0, -(pose.th + yawOff), pose.pt);
  wheelSpin.rotation.z = -P.steer * 2.6;
  const z = inZone();
  helm.visible = anomaly === 1 && z; stdWheel.visible = !helm.visible;
  backseat.visible = anomaly === 10 && z;
  car.updateMatrixWorld(true);
  cam.getWorldPosition(camW);
  sky.position.copy(camW);
  if (!P.homeLeg) city.position.x = pose.x;   /* on the road home the town finally stays put and comes closer */

  /* player headlights */
  WU.uH0p.value.set(2.2, 0.66, 0).applyMatrix4(car.matrixWorld);
  WU.uH0d.value.set(1, -0.03, 0).applyQuaternion(car.quaternion).normalize();
  WU.uH0r.value.set(0, 0, 1).applyQuaternion(car.quaternion);

  /* the follower: a real car, sitting on your path, as far back as the risk says */
  dgN = 0;
  for (const bq of [barricade, barricadeM]) if (bq.g.visible && (clock * 1.4) % 1 < 0.5) for (const l of bq.lamps) dglow(l[0], l[1], l[2], 1.0, 0.55, 0.05, 0.6);
  if (followerOn && !P.homeLeg){
    if (P.onExit){ const sf = P.s - followerDist; if (sf >= 0) exPose(sf, P.d, fpose); else { fpose.x = FORK + sf; fpose.y = 0; fpose.z = DECEL_C + P.d; fpose.th = 0; fpose.pt = 0; } }
    else { fpose.x = P.x - followerDist; fpose.y = 0; fpose.z = P.d; fpose.th = 0; fpose.pt = 0; }
    follower.visible = true;
    follower.position.set(fpose.x, fpose.y, fpose.z); follower.rotation.set(0, -fpose.th, fpose.pt, 'YZX');
    const cs = Math.cos(fpose.th), sn = Math.sin(fpose.th);
    WU.uH1p.value.set(fpose.x + 2.3*cs, fpose.y + 0.66, fpose.z + 2.3*sn);
    WU.uH1d.value.set(cs, -0.03, sn).normalize(); WU.uH1r.value.set(-sn, 0, cs);
    WU.uH1i.value = 1.3 * flash;

  const indOn = (clock * 1.5) % 1 < 0.5;
  for (const c of traffic){
    if (c.stand){
      /* stood on its tail: roof toward you, headlights up top, tail lights on the road */
      const cs = Math.cos(c.th), sn = Math.sin(c.th);
      c.mesh.position.set(c.x + 0.63*cs, 2.25, c.z + 0.63*sn); c.mesh.rotation.set(0, -c.th, Math.PI/2);
      for (const s of [-0.62, 0.62]){ dglow(c.x, 4.52, c.z + s, 1.0, 0.95, 0.85, 0.7); dglow(c.x - 0.1, 0.05, c.z + s, 0.6, 0.05, 0.03, 0.45); }
      continue;

    c.mesh.position.set(c.x, 0, c.z); c.mesh.rotation.set(0, -c.th, 0);
    carLampGlows(c.x, 0, c.z, c.th, c.hl, c.truck, c.onc ? 0 : c.ind, indOn, 1, c.same ? 1.6 : 1);
  }

    f.m.visible = f.on;
    if (!f.on) continue;
    const y = f.y + Math.sin(clock * 1.3 + f.ph) * 0.35;
    f.m.position.set(f.x, y, f.z); f.m.rotation.set(0, Math.PI, Math.sin(clock * 0.9 + f.ph) * 0.03);
    carLampGlows(f.x, y, f.z, Math.PI, 2.25, false, 0, false, 1, 1);
  }
  if (runner.on){
    const moving = runner.x > TUN_B + 6.01, ph = clock * 2 * Math.PI * 2.5, sw = moving ? Math.sin(ph) : 0;
    runner.g.position.set(runner.x, (moving ? Math.abs(Math.cos(ph)) * 0.07 : 0), runner.z);
    runner.legs[0].rotation.z = 0.7 * sw; runner.legs[1].rotation.z = -0.7 * sw;
    runner.arms[0].rotation.z = -0.8 * sw; runner.arms[1].rotation.z = 0.8 * sw;
  }
  for (let i = dgN; i < DG_MAX; i++) dgS[i] = 0;
  dgGeo.attributes.position.needsUpdate = true; dgGeo.attributes.aCol.needsUpdate = true; dgGeo.attributes.aSize.needsUpdate = true;

  /* the cabin is lit by whatever lamp you are under, by the car behind, and red when it ends */
  sampleLM(pose.x, pose.z, lmS);

  let r = 0.06 + lmS[0]*0.42, g = 0.065 + lmS[1]*0.42, b = 0.08 + lmS[2]*0.42;

  cabMat.uniforms.uCab.value.set(r, g, b);
  beadMat.color.setRGB(0.15 + r*0.55, 0.15 + g*0.55, 0.17 + b*0.55);

  let kmh = Math.round(P.v * 3.6);
  if (anomaly === 16 && z) kmh *= 10;
  if (kmhEl.textContent !== String(kmh)) kmhEl.textContent = kmh;
}

/* ---------------------------------------------------------------- sound */

  chain(rainS, F('highpass', 350), rainG, master);
  const trBP = F('bandpass', 700, 0.5), trLG = G(0), trRG = G(0);
  src(white).connect(trBP); trBP.connect(trLG); trBP.connect(trRG);
  for (const [g, p] of [[trLG, -0.8], [trRG, 0.8]]){
    if (ctx.createStereoPanner){ const sp = ctx.createStereoPanner(); sp.pan.value = p; g.connect(sp); sp.connect(bus); } else g.connect(bus);
  }
  const hornG = G(0), h1 = ctx.createOscillator(), h2 = ctx.createOscillator(), hLP = F('lowpass', 1800);
  h1.type = h2.type = 'square'; h1.frequency.value = 415; h2.frequency.value = 523;
  h1.connect(hLP); h2.connect(hLP); chain(hLP, hornG, master); h1.start(); h2.start();
  Object.assign(SND, { ctx, master, bus, white, G, F, roadLP, roadG, hissBP, hissG, eng1, eng2, engG, windBP, windG, windHiG, rainS, rainG, trLG, trRG, hornG, tSend });
}
let gust = 1, gustT = 0, gustTo = 1;
function sndUpdate(dt){
  const S = SND;
  if (!S.ctx || S.ctx.state !== 'running') return;
  const t = S.ctx.currentTime, set = (p, v, k = 0.08) => p.setTargetAtTime(v, t, k);
  const v = P.v, vn = clamp(v / VMAX, 0, 1);
  const tun = !P.onExit && P.x > TUN_A && P.x < TUN_B;
  set(S.roadG.gain, v < 0.3 ? 0 : (0.06 + 0.55 * Math.pow(vn, 1.2)) * (tun ? 1.5 : 1));
  set(S.roadLP.frequency, 140 + 520 * vn);
  set(S.hissG.gain, 0.16 * Math.pow(vn, 1.4));
  set(S.hissBP.frequency, 1300 + 1400 * vn);
  /* engine: four gears, rising through each */
  const GB = [0, 9, 17, 26, 45]; let gi = 0; while (gi < 3 && v > GB[gi + 1]) gi++;
  const fr = clamp((v - GB[gi]) / (GB[gi + 1] - GB[gi]), 0, 1), f = 34 + gi * 4 + fr * 46;
  set(S.eng1.frequency, f, 0.15); set(S.eng2.frequency, f * 0.5, 0.15);
  set(S.engG.gain, P.dead || P.ended ? 0 : 0.05 + 0.09 * lastThr, 0.2);
  /* wind: grows with the square of speed, in slow gusts */
  gustT -= dt; if (gustT <= 0){ gustTo = 0.7 + Math.random() * 0.6; gustT = 0.8 + Math.random() * 2.5; }
  gust += (gustTo - gust) * Math.min(1, dt * 1.2);
  set(S.windG.gain, 0.42 * Math.pow(vn, 2.1) * gust * (tun ? 0.6 : 1));
  set(S.windBP.frequency, 350 + 900 * vn * gust);
  set(S.windHiG.gain, 0.05 * Math.pow(vn, 3) * gust);
  /* rain on the car follows the rain you see: it stops in the tunnel (unless it doesn't) */
  set(S.rainG.gain, rain.visible ? (0.5 + 0.25 * vn) * (P.dead ? 0.3 : 1) : 0, P.dead ? 0.05 : 0.25);
  S.rainS.playbackRate.setTargetAtTime(0.9 + 0.35 * vn, t, 0.3);
  /* cars going by: louder near and with a big speed difference, on the side they pass */
  const cs = Math.cos(pose.th), sn = Math.sin(pose.th);
  let L = 0, Rr = 0;
  const add = (x, y, z, rel, k) => {
    const dx = x - pose.x, dz = z - pose.z, d = Math.hypot(dx, y - pose.y, dz);
    if (d > 140) return;
    const i = k * (0.4 + Math.min(1.6, Math.abs(rel) / 25)) / (1 + (d / 10) ** 2);
    const side = clamp((-dx * sn + dz * cs) / 10, -1, 1);
    L += i * (1 - side) / 2; Rr += i * (1 + side) / 2;
  };
  for (const c of traffic) add(c.x, 0, c.z, (c.onc ? (c.same ? c.v : -c.v) : c.v) - v, c.truck ? 1.8 : 1);
  if (followerOn && !P.homeLeg) add(fpose.x, fpose.y, fpose.z, 6, 1.3);
  for (const fl of flyers) if (fl.on) add(fl.x, fl.y, fl.z, fl.v + v, 1.2);
  set(S.trLG.gain, Math.min(0.7, L * 0.8), 0.05); set(S.trRG.gain, Math.min(0.7, Rr * 0.8), 0.05);
  set(S.tSend.gain, tun ? 0.55 : 0, 0.3);
  /* after a crash, the road, wind and rain drop away under it */
  set(S.bus.gain, P.dead ? 0.15 : 1, P.dead ? 0.03 : 0.3);
  /* the car behind leans on its horn in time with its flashing lights */
  const ph = (clock * 2.4) % 1;
  set(S.hornG.gain, !P.dead && followerOn && P.risk > 0.55 && (ph < 0.22 || (ph > 0.34 && ph < 0.5)) ? 0.07 : 0, 0.015);
}
/* the crash: a hard impact, crumpling metal, a heavy thud, the windscreen going, and parts
   scraping to a stop. Everything else is pulled down under it (see sndUpdate). */
function sndCrash(rear){
  const S = SND;
  if (!S.ctx) return;
  const ctx = S.ctx, t = ctx.currentTime + 0.005, out = S.G(0.95);
  out.connect(S.master);
  const burst = (t0, dur, type, f0, f1, q, peak) => {
    const s = ctx.createBufferSource(), f = S.F(type, f0, q), g = S.G(0);
    s.buffer = S.white; s.connect(f); f.connect(g); g.connect(out);
    f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    s.start(t0, Math.random() * 2); s.stop(t0 + dur + 0.05);
  };
  const tone = (t0, dur, type, f0, f1, peak) => {
    const o = ctx.createOscillator(), g = S.G(0);
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    o.connect(g); g.connect(out);
    g.gain.setValueAtTime(peak, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.05);
  };
  burst(t, 1.3, 'lowpass', 7000, 260, 0.5, 1.3);                               /* the impact */
  tone(t, 0.7, 'sine', 110, 32, 1.1);                                           /* the thud you feel */
  tone(t, 0.35, 'square', 70, 40, 0.25);
  for (let k = 0; k < 9; k++){                                                  /* metal folding */
    const f = 450 + Math.random() * 2600;
    burst(t + Math.random() * 0.45, 0.18 + Math.random() * 0.35, 'bandpass', f, f * (0.55 + Math.random() * 0.3), 5 + Math.random() * 6, 0.55 + Math.random() * 0.45);
  }
  burst(t + 0.03, 0.7, 'highpass', 5000, 3000, 0.7, 0.55);                      /* the windscreen */
  for (let k = 0; k < 26; k++){
    const tt = t + 0.04 + Math.pow(Math.random(), 1.6) * 0.9;
    tone(tt, 0.06 + Math.random() * 0.18, 'triangle', 2400 + Math.random() * 5000, 2200 + Math.random() * 4000, 0.05 + Math.random() * 0.1);
  }
  burst(t + 0.25, 1.4, 'bandpass', 1400, 700, 2.5, 0.28);                       /* scraping to a stop */
  if (rear){                                                                    /* the car behind, still on its horn */
    for (const hf of [415, 523]){
      const o = ctx.createOscillator(), g = S.G(0), lp = S.F('lowpass', 1800);
      o.type = 'square'; o.frequency.value = hf; o.connect(lp); lp.connect(g); g.connect(out);
      g.gain.setValueAtTime(0.06, t + 0.15); g.gain.setTargetAtTime(0, t + 1.4, 0.25);
      o.start(t + 0.15); o.stop(t + 2.6);
    }
  }
}

/* ---------------------------------------------------------------- render loop */
let mainScale = 600, mirrorScale = RT_H / (2 * Math.tan(17.2 * D2R / 2)), frameNo = 0;
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.fov = clamp(2 * Math.atan(Math.tan(39 * D2R) / cam.aspect) / D2R, 38, 72);
  cam.updateProjectionMatrix();
  mainScale = h * pr / (2 * Math.tan(cam.fov * D2R / 2));
  cityMat.uniforms.uPR.value = pr;
  $('rotate').hidden = !(isMobile && h > w);
}
addEventListener('resize', resize);
resize();

let last = performance.now(), acc = 0, frames = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running && !document.hidden) step(dt);
  sync();
  sndUpdate(dt);
  frameNo++;
  if (!isMobile || frameNo % 2 === 0){
    glowMat.uniforms.uScale.value = mirrorScale; cityMat.uniforms.uPR.value = 0.7;
    renderer.setRenderTarget(mirrorRT); renderer.render(scene, mcam); renderer.setRenderTarget(null);
  }
  glowMat.uniforms.uScale.value = mainScale; cityMat.uniforms.uPR.value = pr;
  renderer.render(scene, cam);
  /* hold the frame rate by trading resolution */
  acc += dt; frames++;
  if (running && acc > 2){
    const avg = acc / frames;
    if (avg > 0.028 && pr > 0.7){ pr = Math.max(0.7, pr - 0.2); resize(); }
    else if (avg < 0.017 && pr < BASE_PR){ pr = Math.min(BASE_PR, pr + 0.1); resize(); }
    acc = 0; frames = 0;
  }
}

/* ---------------------------------------------------------------- start, pause, resume */
const panel = $('panel'), pauseBtn = $('pause'), touchEl = $('touch');
let wakeLock = null;
async function keepAwake(){ try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {} }
const sndBtn = $('snd');
function paintSnd(){
  sndBtn.classList.toggle('off', !SND.on); sndBtn.setAttribute('aria-pressed', String(SND.on));
  sndBtn.setAttribute('aria-label', SND.on ? '音を消す' : '音を出す');
}
function toggleSnd(){
  SND.on = !SND.on;
  try { localStorage.setItem('nd-sound', SND.on ? 'on' : 'off'); } catch (_) {}
  if (SND.master) SND.master.gain.setTargetAtTime(SND.on ? SND_VOL : 0, SND.ctx.currentTime, 0.05);
  paintSnd();
}
sndBtn.addEventListener('click', toggleSnd);
addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) toggleSnd(); });
paintSnd();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) keepAwake();
  if (SND.ctx){ if (document.hidden) SND.ctx.suspend(); else if (running || P.over || P.ended) SND.ctx.resume(); }
  last = performance.now();
});
function begin(){
  sndInit(); if (SND.ctx) SND.ctx.resume();
  sndBtn.hidden = false;
  panel.hidden = true; running = true; pauseBtn.hidden = false;
  touchEl.hidden = !(isMobile || navigator.maxTouchPoints > 0);
  last = performance.now(); keepAwake();
  canvas.focus?.();
}
startBtn.addEventListener('click', begin);
$('retry').addEventListener('click', () => { resetRun(); begin(); });
$('again').addEventListener('click', () => { resetRun(); begin(); });
pauseBtn.addEventListener('click', () => {
  running = false; panel.hidden = false; pauseBtn.hidden = true;
  if (SND.ctx) SND.ctx.suspend();
  startBtn.textContent = '再開'; startBtn.focus();
  for (const k in touch) touch[k] = 0;
});
addEventListener('keydown', e => { if (e.code === 'Escape' && running && !P.over && !P.ended) pauseBtn.click(); });

function boot(data){
  if (data && Number.isFinite(data.count)) P.count = clamp(data.count | 0, 0, 8);
  playerPose(pose); seedTraffic(); rollAnomaly(); sync();
  startBtn.disabled = false; startBtn.textContent = '出発';
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ count: P.count }));
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
window.__nd = { P, pose, SND, traffic, flyers, runner, enterTunnel, standCar, barricade, barricadeM, EX, HOME, HOME_M, ANOMALIES, step, frame, layout: { SIGN_X, ZONE_A, ZONE_B, GANTRY_X, DECEL_START, FORK, X_JOIN, S_MERGE, OUT_END, ACC_END, MERGE_END, TUN_A, TUN_B, HM_A, HM_FULL, HM_FORK, SECTION }, get anomaly(){ return anomaly; }, setAnomaly(id){ anomaly = id; applyAnomaly(); } };
</script>
